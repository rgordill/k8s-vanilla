apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Application
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/grafana/ingress/hosts/0
        value: grafana.k8s.sandbox1480.opentlc.com
