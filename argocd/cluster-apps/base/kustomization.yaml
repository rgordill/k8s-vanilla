apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../cert-manager
  - ../../ingress
  - ../../storage
  - ../../monitoring/base

# Replace INGRESS_DOMAIN_PLACEHOLDER in Application resources with value from global-config
# The global-config ConfigMap is generated by the overlay with environment-specific values
replacements:
  - source:
      kind: ConfigMap
      name: global-config
      fieldPath: data.INGRESS_DOMAIN
    targets:
      - select:
          kind: Application
          name: kube-prometheus-stack
        fieldPaths:
          - spec.source.helm.valuesObject.grafana.ingress.hosts.[0]

# Set initial placeholder value (will be replaced by replacements above)
patches:
  - target:
      kind: Application
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/grafana/ingress/hosts/0
        value: grafana.INGRESS_DOMAIN_PLACEHOLDER
