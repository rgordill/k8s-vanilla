apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../cert-manager
  - ../../ingress
  - ../../storage
  - ../../monitoring/base

# Generate global-config ConfigMap
# Note: Ansible creates this ConfigMap directly in the cluster with the actual domain value
# This ConfigMap in the kustomization is used by replacements to inject values into Applications
# ArgoCD will ignore differences in this ConfigMap (see cluster-apps Application ignoreDifferences)
configMapGenerator:
  - name: global-config
    namespace: argocd
    literals:
      - INGRESS_DOMAIN=INGRESS_DOMAIN_PLACEHOLDER

# Note: Kustomize replacements cannot directly target array elements by index
# The base Application already has grafana.INGRESS_DOMAIN_PLACEHOLDER in the hosts array
# Ansible will update the Application after ArgoCD syncs to use the domain from global-config ConfigMap
# This ensures the domain from Ansible cascades correctly without requiring kustomization changes
