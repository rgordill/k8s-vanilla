apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../cert-manager
  - ../../ingress
  - ../../storage
  - ../../monitoring/base

# Generate global-config ConfigMap
# Note: Ansible creates this ConfigMap directly in the cluster with the actual domain value
# This ConfigMap in the kustomization is used by replacements to inject values into Applications
# ArgoCD will ignore differences in this ConfigMap (see cluster-apps Application ignoreDifferences)
configMapGenerator:
  - name: global-config
    namespace: argocd
    literals:
      - INGRESS_DOMAIN=INGRESS_DOMAIN_PLACEHOLDER

# Replace INGRESS_DOMAIN_PLACEHOLDER in Application resources with value from global-config
# This reads from the ConfigMap generated above (which has the placeholder)
# The actual value comes from the cluster ConfigMap created by Ansible
replacements:
  - source:
      kind: ConfigMap
      name: global-config
      fieldPath: data.INGRESS_DOMAIN
    targets:
      - select:
          kind: Application
          name: kube-prometheus-stack
        fieldPaths:
          - spec.source.helm.valuesObject.grafana.ingress.hosts.[0]

# Set initial placeholder value (will be replaced by replacements above)
patches:
  - target:
      kind: Application
      name: kube-prometheus-stack
    patch: |-
      - op: replace
        path: /spec/source/helm/valuesObject/grafana/ingress/hosts/0
        value: grafana.INGRESS_DOMAIN_PLACEHOLDER
