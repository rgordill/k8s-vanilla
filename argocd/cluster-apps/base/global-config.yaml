apiVersion: v1
kind: ConfigMap
metadata:
  name: global-config
  namespace: argocd
  annotations:
    # This ConfigMap is managed by Ansible - ArgoCD should ignore differences
    argocd.argoproj.io/sync-options: Prune=false
data:
  # This ConfigMap is created by Ansible with the actual ingress domain
  # The value here is a placeholder - Ansible creates/updates it with the real value
  # Kustomize replacements reference this ConfigMap to inject values into Applications
  INGRESS_DOMAIN: "INGRESS_DOMAIN_PLACEHOLDER"
