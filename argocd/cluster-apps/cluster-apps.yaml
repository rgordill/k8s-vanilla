---
# App of Apps pattern - Deploy all applications from this repository
# NOTE: This file is a reference. The actual deployment uses the Ansible template
# at ansible/roles/argocd/templates/apps.yaml.j2 which sets the correct
# Kustomize overlay path based on terraform_provider (aws or libvirt).
#
# Example paths:
#   - aws:     argocd/cluster-apps/overlays/aws
#   - libvirt: argocd/cluster-apps/overlays/libvirt
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-apps
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/finalizer
spec:
  project: default
  source:
    # Update this to your Git repository URL
    repoURL: https://github.com/rgordill/k8s-vanilla.git
    targetRevision: HEAD
    # Path is set dynamically by Ansible based on terraform_provider
    # path: argocd/cluster-apps/overlays/aws      # for AWS
    # path: argocd/cluster-apps/overlays/libvirt  # for libvirt
    path: argocd/cluster-apps/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
