---
# Playbook to provision infrastructure with Terraform
# Set terraform_provider variable to 'libvirt' or 'aws'

- name: Provision infrastructure with Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_dir: "{{ playbook_dir }}/../../terraform/{{ terraform_provider }}"
    terraform_state_file: "{{ terraform_dir }}/terraform.tfstate"

  pre_tasks:
    - name: Override terraform_provider from environment if set
      ansible.builtin.set_fact:
        terraform_provider: "{{ lookup('env', 'TERRAFORM_PROVIDER') }}"
      when: lookup('env', 'TERRAFORM_PROVIDER') | length > 0

  tasks:
    - name: Display selected provider
      ansible.builtin.debug:
        msg: "Provisioning with Terraform provider: {{ terraform_provider }}"

    - name: Validate provider selection
      ansible.builtin.assert:
        that:
          - terraform_provider in ['libvirt', 'aws']
        fail_msg: "Invalid terraform_provider '{{ terraform_provider }}'. Must be 'libvirt' or 'aws'."
        success_msg: "Using provider: {{ terraform_provider }}"

    - name: Check if Terraform directory exists
      ansible.builtin.stat:
        path: "{{ terraform_dir }}"
      register: terraform_dir_check

    - name: Fail if Terraform directory does not exist
      ansible.builtin.fail:
        msg: "Terraform directory '{{ terraform_dir }}' does not exist"
      when: not terraform_dir_check.stat.exists

    - name: Check if Terraform is initialized
      ansible.builtin.stat:
        path: "{{ terraform_dir }}/.terraform"
      register: terraform_init_check

    - name: Initialize Terraform
      ansible.builtin.command:
        cmd: terraform init
        chdir: "{{ terraform_dir }}"
      when: not terraform_init_check.stat.exists
      changed_when: true

    - name: Validate Terraform configuration
      ansible.builtin.command:
        cmd: terraform validate
        chdir: "{{ terraform_dir }}"
      changed_when: false

# ============================================================================
# LIBVIRT-SPECIFIC VARIABLES
# ============================================================================
    - name: Create Terraform variables file (libvirt)
      ansible.builtin.copy:
        dest: "{{ terraform_dir }}/terraform.tfvars"
        mode: '0600'
        content: |
          # Libvirt connection
          libvirt_uri = "{{ libvirt_uri }}"
          
          # Network configuration
          network_name         = "{{ libvirt_network_name }}"
          network_mode         = "{{ libvirt_network_mode }}"
          network_cidr         = "{{ libvirt_network_cidr }}"
          domain               = "{{ libvirt_domain }}"
          use_existing_network = {{ libvirt_use_existing_network | lower }}
          
          # Virtual Machine settings
          hostname       = "{{ libvirt_hostname }}"
          ip             = "{{ libvirt_ip }}"
          mac_address    = ""
          memory         = {{ libvirt_memory }}
          vcpus          = {{ libvirt_vcpus }}
          main_disk_size = {{ libvirt_disk_size }}
          
          # Image configuration
          download_image = {{ libvirt_download_image | lower }}
          image_base     = "Fedora-Cloud-Base-Generic-42-1.1.x86_64.qcow2"
          image_source   = "https://download.fedoraproject.org/pub/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-42-1.1.x86_64.qcow2"
          
          # Authentication
          ssh_public_key_file = "{{ ssh_public_key_file | default('~/.ssh/id_rsa.pub') }}"
          ssh_user            = "{{ ssh_user | default('fedora') }}"
      when: terraform_provider == "libvirt"

# ============================================================================
# AWS-SPECIFIC VARIABLES
# ============================================================================
    - name: Create Terraform variables file (AWS)
      ansible.builtin.copy:
        dest: "{{ terraform_dir }}/terraform.tfvars"
        mode: '0600'
        content: |
          # AWS configuration
          aws_region        = "{{ aws_region }}"
          availability_zone = "{{ aws_availability_zone }}"
          
          # Network configuration
          vpc_cidr    = "{{ aws_vpc_cidr }}"
          subnet_cidr = "{{ aws_subnet_cidr }}"
          
          # EC2 Instance settings
          hostname         = "{{ aws_hostname }}"
          instance_type    = "{{ aws_instance_type }}"
          root_volume_size = {{ aws_root_volume_size }}
          root_volume_type = "{{ aws_root_volume_type }}"
          
          # AMI Configuration (leave ami_id empty to auto-select latest Fedora)
          ami_id          = ""
          ami_owner       = "125523088429"  # Fedora Project
          ami_name_pattern = "Fedora-Cloud-Base-AmazonEC2.x86_64-42-*"
          
          # Authentication
          ssh_public_key_file = "{{ ssh_public_key_file | default('~/.ssh/id_rsa.pub') }}"
          ssh_user            = "{{ ssh_user | default('fedora') }}"
          key_pair_name       = "k8s-vanilla-key"
          
          # Kubernetes Network (used by Ansible)
          pod_network_cidr = "{{ pod_network_cidr }}"
          service_cidr     = "{{ service_cidr }}"
          
          # Route53 DNS Configuration
          route53_zone_name = "{{ aws_route53_zone_name | default('') }}"
      when: terraform_provider == "aws"

# ============================================================================
# COMMON TERRAFORM OPERATIONS
# ============================================================================
    - name: Apply Terraform configuration
      ansible.builtin.command:
        cmd: terraform apply -auto-approve
        chdir: "{{ terraform_dir }}"
      register: terraform_apply
      changed_when: "'Apply complete!' in terraform_apply.stdout"

    - name: Display Terraform outputs
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ terraform_dir }}"
      register: terraform_outputs
      changed_when: false

    - name: Parse Terraform outputs
      ansible.builtin.set_fact:
        tf_outputs: "{{ terraform_outputs.stdout | from_json }}"

    - name: Display VM information
      ansible.builtin.debug:
        msg:
          - "Provider: {{ terraform_provider }}"
          - "VM Name: {{ tf_outputs.vm_name.value }}"
          - "VM IP: {{ tf_outputs.vm_ip.value }}"
          - "SSH User: {{ tf_outputs.ssh_user.value }}"

    - name: Set TERRAFORM_PROVIDER environment hint
      ansible.builtin.debug:
        msg: "Run 'export TERRAFORM_PROVIDER={{ terraform_provider }}' before running other playbooks"

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ tf_outputs.vm_ip.value }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      when: terraform_apply.changed
